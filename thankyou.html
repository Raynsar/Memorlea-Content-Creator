<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terima Kasih – Memorléa</title>
  <link rel="icon" type="image/png" href="assets/images/logo.png"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<main class="thankyou-page">
  <div class="thankyou-card">
    <img src="assets/images/logo.png" alt="Memorléa"/>
    <h1 class="thankyou-title">Terima Kasih!</h1>
    <p class="thankyou-msg" id="thankyou-msg">
      Formulirmu telah kami terima dengan baik.<br/>
      Tim Memorléa akan segera menghubungimu untuk diskusi lebih lanjut. ✨
    </p>
    <p class="thankyou-redirect">
      Kamu akan diarahkan ke pricelist dalam <span id="countdown">3</span> detik...
    </p>
    <div class="thankyou-progress">
      <div class="thankyou-progress-bar" id="progress-bar"></div>
    </div>
  </div>
</main>

<script src="js/thankyou.js"></script>
</body>
</html>
